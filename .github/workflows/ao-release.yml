name: AO deployment artifact
on:
  workflow_dispatch:
    inputs:
      build_runtime:
        description: Build the runtime image (disable only when runtime sources are unchanged)
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Fetch pinned patched AO fork
        run: |
          git clone --filter=blob:none https://github.com/ronigooja/agent-orchestrator.git "$RUNNER_TEMP/ao"
          git -C "$RUNNER_TEMP/ao" checkout 07381ac9e
          test -z "$(git -C "$RUNNER_TEMP/ao" status --porcelain)"
      - name: Test AO container and provider adapters
        working-directory: ${{ runner.temp }}/ao/backend
        run: go test ./internal/adapters/chatdriver/codexappserver ./internal/adapters/agentaccount ./internal/session_manager ./internal/service/session ./internal/httpd/controllers
      - name: Build AO and runtime image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          cd "$RUNNER_TEMP/ao/backend"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/artifacts/ao" ./cmd/ao
          cd "$GITHUB_WORKSPACE"
          if [ "${{ inputs.build_runtime }}" = true ]; then
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zoe-ao-codex"
            image_tag="${GITHUB_SHA}"
            printf '%s\n' "$image:$image_tag" > "$RUNNER_TEMP/artifacts/IMAGE_REFERENCE"
            docker buildx build --push --platform linux/amd64 \
              -t "$image:$image_tag" -t "$image:${GITHUB_SHA:0:12}" \
              --metadata-file "$RUNNER_TEMP/ao-runtime-metadata.json" deploy/linux/AO/runtime
            python3 - "$RUNNER_TEMP/ao-runtime-metadata.json" "$RUNNER_TEMP/artifacts/IMAGE_DIGEST" <<'PY'
          import json, pathlib, sys
          digest = json.loads(pathlib.Path(sys.argv[1]).read_text()).get("containerimage.digest", "")
          if not digest.startswith("sha256:"):
              raise SystemExit("runtime image metadata did not contain an immutable digest")
          pathlib.Path(sys.argv[2]).write_text(digest + "\n")
          PY
          fi
          cd "$RUNNER_TEMP/artifacts"
          sha256sum ao > SHA256SUMS
          for file in IMAGE_REFERENCE IMAGE_DIGEST; do
            if [ -f "$file" ]; then sha256sum "$file" >> SHA256SUMS; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ao-release-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts
          retention-days: 1
          compression-level: 0
