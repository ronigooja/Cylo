name: AO deployment artifact
on:
  workflow_dispatch:
    inputs:
      build_runtime:
        description: Build the runtime image (disable only when runtime sources are unchanged)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Fetch pinned patched AO fork
        run: |
          git clone --filter=blob:none https://github.com/ronigooja/agent-orchestrator.git "$RUNNER_TEMP/ao"
          git -C "$RUNNER_TEMP/ao" checkout 07381ac9e
          test -z "$(git -C "$RUNNER_TEMP/ao" status --porcelain)"
      - name: Test AO container and provider adapters
        working-directory: ${{ runner.temp }}/ao/backend
        run: go test ./internal/adapters/chatdriver/codexappserver ./internal/adapters/agentaccount ./internal/session_manager ./internal/service/session ./internal/httpd/controllers
      - name: Build AO and runtime image
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cd "$RUNNER_TEMP/ao/backend"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/artifacts/ao" ./cmd/ao
          cd "$GITHUB_WORKSPACE"
          if [ "${{ inputs.build_runtime }}" = true ]; then
            docker build --platform linux/amd64 -t "zoe-ao-codex:${GITHUB_SHA:0:12}" deploy/linux/AO/runtime
            docker save "zoe-ao-codex:${GITHUB_SHA:0:12}" | gzip > "$RUNNER_TEMP/artifacts/runtime-image.tar.gz"
          fi
          cd "$RUNNER_TEMP/artifacts"
          sha256sum ao > SHA256SUMS
          if [ -f runtime-image.tar.gz ]; then sha256sum runtime-image.tar.gz >> SHA256SUMS; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ao-release-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts
          retention-days: 1
          compression-level: 0
