name: Linux checks

on:
  workflow_call:
    inputs:
      go:
        type: boolean
        required: true
      race:
        type: boolean
        required: true
      scripts:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Build operator release artifacts after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    if: github.event_name == 'workflow_dispatch' || inputs.go
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare runner environment
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/environment/zoe-linux"
          mkdir -p "$root/logs" "$root/tmp" "$root/go-cache" "$root/go" "$root/toolcache"
          {
            echo "ZOE_OUTPUT=$root"
            echo "TMPDIR=$root/tmp"
            echo "GOCACHE=$root/go-cache"
            echo "GOPATH=$root/go"
            echo "RUNNER_TOOL_CACHE=$root/toolcache"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Record source and environment
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git status --short
            go version
            uname -a
          } > "$ZOE_OUTPUT/logs/environment.txt"
      - name: Run Go tests
        shell: bash
        run: |
          set +e
          set -uo pipefail
          printf '%s\n' 'go test ./...' > "$ZOE_OUTPUT/logs/go-tests.command"
          go test ./... > "$ZOE_OUTPUT/logs/go-tests.log" 2>&1
          status=$?
          echo "$status" > "$ZOE_OUTPUT/logs/go-tests.exit"
          if [[ "$status" -ne 0 ]]; then
            tail -n 80 "$ZOE_OUTPUT/logs/go-tests.log"
          fi
          exit "$status"
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-go-logs-${{ github.sha }}
          path: ${{ env.ZOE_OUTPUT }}/logs
          retention-days: 7
          if-no-files-found: error

  race:
    if: github.event_name == 'workflow_dispatch' || inputs.race
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare runner environment
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/environment/zoe-linux"
          mkdir -p "$root/logs" "$root/tmp" "$root/go-cache" "$root/go" "$root/toolcache"
          {
            echo "ZOE_OUTPUT=$root"
            echo "TMPDIR=$root/tmp"
            echo "GOCACHE=$root/go-cache"
            echo "GOPATH=$root/go"
            echo "RUNNER_TOOL_CACHE=$root/toolcache"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Record source and environment
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git status --short
            go version
            uname -a
          } > "$ZOE_OUTPUT/logs/environment.txt"
      - name: Race-check authorization
        shell: bash
        run: |
          set +e
          set -uo pipefail
          printf '%s\n' 'go test -race ./internal/control ./internal/runner ./internal/agents/ao ./cmd/zoe-server ./internal/ops ./cmd/zoe' > "$ZOE_OUTPUT/logs/auth-race.command"
          go test -race ./internal/control ./internal/runner ./internal/agents/ao ./cmd/zoe-server ./internal/ops ./cmd/zoe > "$ZOE_OUTPUT/logs/auth-race.log" 2>&1
          status=$?
          echo "$status" > "$ZOE_OUTPUT/logs/auth-race.exit"
          if [[ "$status" -ne 0 ]]; then
            tail -n 80 "$ZOE_OUTPUT/logs/auth-race.log"
          fi
          exit "$status"
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-race-logs-${{ github.sha }}
          path: ${{ env.ZOE_OUTPUT }}/logs
          retention-days: 7
          if-no-files-found: error

  scripts:
    if: github.event_name == 'workflow_dispatch' || inputs.scripts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare runner environment
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/environment/zoe-linux"
          mkdir -p "$root/logs" "$root/tmp" "$root/go-cache" "$root/go" "$root/toolcache"
          {
            echo "ZOE_OUTPUT=$root"
            echo "TMPDIR=$root/tmp"
            echo "GOCACHE=$root/go-cache"
            echo "GOPATH=$root/go"
            echo "RUNNER_TOOL_CACHE=$root/toolcache"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Record source and environment
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git status --short
            go version
            uname -a
          } > "$ZOE_OUTPUT/logs/environment.txt"
      - name: Verify immutable release
        shell: bash
        run: |
          set +e
          set -uo pipefail
          printf '%s\n' 'bash deploy/linux/test-build-release.sh' > "$ZOE_OUTPUT/logs/test-build-release.command"
          bash deploy/linux/test-build-release.sh > "$ZOE_OUTPUT/logs/test-build-release.log" 2>&1
          status=$?
          echo "$status" > "$ZOE_OUTPUT/logs/test-build-release.exit"
          if [[ "$status" -ne 0 ]]; then
            tail -n 80 "$ZOE_OUTPUT/logs/test-build-release.log"
          fi
          exit "$status"
      - name: Verify CLI installation
        shell: bash
        run: |
          set +e
          set -uo pipefail
          printf '%s\n' 'bash deploy/linux/test-install-cli.sh' > "$ZOE_OUTPUT/logs/test-install-cli.command"
          bash deploy/linux/test-install-cli.sh > "$ZOE_OUTPUT/logs/test-install-cli.log" 2>&1
          status=$?
          echo "$status" > "$ZOE_OUTPUT/logs/test-install-cli.exit"
          if [[ "$status" -ne 0 ]]; then
            tail -n 80 "$ZOE_OUTPUT/logs/test-install-cli.log"
          fi
          exit "$status"
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-scripts-logs-${{ github.sha }}
          path: ${{ env.ZOE_OUTPUT }}/logs
          retention-days: 7
          if-no-files-found: error

  checks:
    if: always()
    needs: [go, race, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to pass
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          GO_SELECTED: ${{ inputs.go }}
          RACE_SELECTED: ${{ inputs.race }}
          SCRIPTS_SELECTED: ${{ inputs.scripts }}
          GO_RESULT: ${{ needs.go.result }}
          RACE_RESULT: ${{ needs.race.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
        shell: bash
        run: |
          set -euo pipefail
          for check in GO RACE SCRIPTS; do
            selected="${check}_SELECTED"
            result="${check}_RESULT"
            if [[ "$MANUAL" == true || "${!selected}" == true ]]; then
              [[ "${!result}" == success ]] || { echo "$check check: ${!result}"; exit 1; }
            else
              [[ "${!result}" == skipped ]] || { echo "$check unexpectedly ran: ${!result}"; exit 1; }
            fi
          done

  operator-artifacts:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare runner environment
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/environment/zoe-linux"
          mkdir -p "$root/logs" "$root/tmp" "$root/go-cache" "$root/go" "$root/toolcache"
          {
            echo "ZOE_OUTPUT=$root"
            echo "TMPDIR=$root/tmp"
            echo "GOCACHE=$root/go-cache"
            echo "GOPATH=$root/go"
            echo "RUNNER_TOOL_CACHE=$root/toolcache"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build operator binary
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          set +e
          set -uo pipefail
          output="$ZOE_OUTPUT"
          mkdir -p "$output/artifacts/bin" "$output/artifacts/deploy-linux"
          {
            git rev-parse HEAD
            git status --short
            go version
            uname -a
            printf 'GOOS=%s GOARCH=%s CGO_ENABLED=%s\n' "$GOOS" "$GOARCH" "$CGO_ENABLED"
          } > "$output/logs/environment.txt"
          printf '%s\n' "CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -trimpath -buildvcs=false -ldflags='-s -w' -o bin/zoe ./cmd/zoe" > "$output/logs/build.command"
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output/artifacts/bin/zoe" ./cmd/zoe > "$output/logs/build.log" 2>&1
          status=$?
          echo "$status" > "$output/logs/build.exit"
          if [[ "$status" -ne 0 ]]; then
            tail -n 80 "$output/logs/build.log"
            exit "$status"
          fi
          set -e
          cp deploy/linux/install-cli.sh "$output/artifacts/deploy-linux/"
          git rev-parse HEAD > "$output/artifacts/SOURCE_REVISION"
          cd "$output/artifacts"
          sha256sum bin/zoe deploy-linux/install-cli.sh SOURCE_REVISION > SHA256SUMS
          tar -czf "$output/zoe-linux-$GOARCH.tar.gz" bin deploy-linux SOURCE_REVISION SHA256SUMS
      - name: Upload operator build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-linux-${{ matrix.arch }}-logs-${{ github.sha }}
          path: ${{ env.ZOE_OUTPUT }}/logs
          retention-days: 7
          if-no-files-found: error
      - name: Upload operator release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-linux-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ env.ZOE_OUTPUT }}/zoe-linux-${{ matrix.arch }}.tar.gz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
