name: OpenCode runtime image

# Publishes the Zoe OpenCode runtime image. The tag is a hash of the build inputs, so an
# unchanged image is never rebuilt: a matching tag in GHCR is reused and only its digest is printed.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if an image with the same input hash already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Publish or reuse image
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          context=deploy/linux/second-runtime/opencode
          input_hash=$(cd "$context" && find . -type f ! -name 'test_*' ! -name '*.example' ! -name 'build-image.sh' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          opencode_version=$(python3 -c "import json;print(json.load(open('$context/package.json'))['dependencies']['opencode-ai'])")
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zoe-opencode"
          tag="${opencode_version}-${input_hash}"
          echo "tag=$tag" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FORCE" != "true" ]] && digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"') && [[ "$digest" == sha256:* ]]; then
            echo "reused existing image $image:$tag"
          else
            docker buildx build --push --platform linux/amd64 --provenance=false \
              --cache-from "type=gha,scope=opencode-image" --cache-to "type=gha,mode=max,scope=opencode-image" \
              -t "$image:$tag" --metadata-file "$RUNNER_TEMP/meta.json" "$context"
            digest=$(python3 -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/meta.json'))['containerimage.digest'])")
          fi
          [[ "$digest" == sha256:* ]] || { echo "no digest" >&2; exit 1; }
          echo "ZOE_OPENCODE_IMAGE=$image@$digest" | tee "$RUNNER_TEMP/IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-image-reference
          path: ${{ runner.temp }}/IMAGE_DIGEST
          retention-days: 30
          if-no-files-found: error
