name: Server deployment artifact

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Build deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GITHUB_REF_NAME:-reconciliation-${GITHUB_SHA:0:12}}"
          export image_tag
          mkdir -p "$RUNNER_TEMP/zoe-release/logs" "$RUNNER_TEMP/zoe-release/artifacts"
          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          export image_namespace
          server_image="$image_namespace/zoe-server"
          memory_image="$image_namespace/zoe-memory-worker"
          runner_image="$image_namespace/zoe-runner"
          export server_image memory_image runner_image
          printf '%s\n' "$server_image:$image_tag" > "$RUNNER_TEMP/zoe-release/artifacts/IMAGE_REFERENCES"
          printf '%s\n' "$memory_image:$image_tag" >> "$RUNNER_TEMP/zoe-release/artifacts/IMAGE_REFERENCES"
          printf '%s\n' "$runner_image:$image_tag" >> "$RUNNER_TEMP/zoe-release/artifacts/IMAGE_REFERENCES"
          {
            git rev-parse HEAD
            git status --short
            uname -a
            go version
            docker version
          } > "$RUNNER_TEMP/zoe-release/logs/environment.txt"
          set +e
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' \
            -o "$RUNNER_TEMP/zoe-release/artifacts/zoe-server" ./cmd/zoe-server \
            2>&1 | tee "$RUNNER_TEMP/zoe-release/logs/binary-build.log"
          status=$?
          echo "$status" > "$RUNNER_TEMP/zoe-release/logs/binary-build.exit"
          test "$status" -eq 0 || exit "$status"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' \
            -o "$RUNNER_TEMP/zoe-release/artifacts/zoe-runner" ./cmd/zoe-runner \
            2>&1 | tee "$RUNNER_TEMP/zoe-release/logs/runner-build.log"
          status=$?
          echo "$status" > "$RUNNER_TEMP/zoe-release/logs/runner-build.exit"
          test "$status" -eq 0 || exit "$status"
          docker buildx build --push --platform linux/amd64 --cache-from "type=gha,scope=server-${GITHUB_REF_NAME}" --cache-to "type=gha,mode=max,scope=server-${GITHUB_REF_NAME}" -f deploy/linux/Dockerfile.server \
            -t "${server_image}:${image_tag}" -t "${server_image}:${GITHUB_SHA}" --metadata-file "$RUNNER_TEMP/zoe-release/server-metadata.json" . \
            2>&1 | tee "$RUNNER_TEMP/zoe-release/logs/image-build.log"
          status=$?
          echo "$status" > "$RUNNER_TEMP/zoe-release/logs/image-build.exit"
          test "$status" -eq 0 || exit "$status"
          # The memory worker changes rarely: tag it by a hash of its inputs and reuse a published image.
          memory_hash=$(cat deploy/linux/Dockerfile.memory deploy/linux/secret-entrypoint.go | sha256sum | cut -c1-16)
          memory_hash="$memory_hash-$(find services -type f ! -name '*.pyc' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
          memory_content_tag="content-$memory_hash"
          if memory_digest=$(docker buildx imagetools inspect "${memory_image}:${memory_content_tag}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"') && [[ "$memory_digest" == sha256:* ]]; then
            echo "reusing ${memory_image}:${memory_content_tag}" | tee "$RUNNER_TEMP/zoe-release/logs/memory-image-build.log"
            printf '{"containerimage.digest":"%s"}\n' "$memory_digest" > "$RUNNER_TEMP/zoe-release/memory-metadata.json"
            echo 0 > "$RUNNER_TEMP/zoe-release/logs/memory-image-build.exit"
          else
            docker buildx build --push --platform linux/amd64 --cache-from "type=gha,scope=memory" --cache-to "type=gha,mode=max,scope=memory" -f deploy/linux/Dockerfile.memory \
              -t "${memory_image}:${memory_content_tag}" --metadata-file "$RUNNER_TEMP/zoe-release/memory-metadata.json" . \
              2>&1 | tee "$RUNNER_TEMP/zoe-release/logs/memory-image-build.log"
            status=$?
            echo "$status" > "$RUNNER_TEMP/zoe-release/logs/memory-image-build.exit"
            test "$status" -eq 0 || exit "$status"
          fi
          docker buildx imagetools create -t "${memory_image}:${image_tag}" -t "${memory_image}:${GITHUB_SHA}" "${memory_image}@$(python3 -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/zoe-release/memory-metadata.json'))['containerimage.digest'])")" \
            2>&1 | tee -a "$RUNNER_TEMP/zoe-release/logs/memory-image-build.log"
          docker buildx build --push --platform linux/amd64 --cache-from "type=gha,scope=runner-${GITHUB_REF_NAME}" --cache-to "type=gha,mode=max,scope=runner-${GITHUB_REF_NAME}" -f deploy/linux/Dockerfile.runner \
            -t "${runner_image}:${image_tag}" -t "${runner_image}:${GITHUB_SHA}" --metadata-file "$RUNNER_TEMP/zoe-release/runner-metadata.json" . \
            2>&1 | tee "$RUNNER_TEMP/zoe-release/logs/runner-image-build.log"
          status=$?
          echo "$status" > "$RUNNER_TEMP/zoe-release/logs/runner-image-build.exit"
          test "$status" -eq 0 || exit "$status"
          set -e
          cd "$RUNNER_TEMP/zoe-release/artifacts"
          printf '%s\n' "$GITHUB_SHA" > SOURCE_REVISION
          sha256sum zoe-server zoe-runner SOURCE_REVISION IMAGE_REFERENCES > SHA256SUMS
          python3 - <<'PYJSON'
          import hashlib, json, os, pathlib
          root = pathlib.Path(".")
          files = [{"name": p.name, "path": p.name, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.is_file() and p.name != "release-manifest.json"]
          images = {}
          for name, metadata in (("zoe-server", "server-metadata.json"), ("zoe-memory-worker", "memory-metadata.json"), ("zoe-runner", "runner-metadata.json")):
              data = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "zoe-release", metadata).read_text())
              digest = data.get("containerimage.digest", "")
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"missing immutable digest in {metadata}")
              images[name] = {"ref": f"{os.environ['image_namespace']}/{name}:{os.environ['image_tag']}", "digest": digest}
          (root / "release-manifest.json").write_text(json.dumps({"schema":1,"release":os.environ["image_tag"],"source_revision":os.environ["GITHUB_SHA"],"architecture":"amd64","platform":"linux/amd64","artifacts":files,"images":images}, indent=2)+"\n")
          PYJSON
      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-release-logs-${{ github.sha }}
          path: ${{ runner.temp }}/zoe-release/logs
          retention-days: 7
      - name: Upload deployment artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-release-${{ github.sha }}
          path: ${{ runner.temp }}/zoe-release/artifacts
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
